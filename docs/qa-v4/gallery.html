<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Nexo · Comparación V3.1 / V4</title><style>body{margin:0;padding:24px;background:#070e1c;color:#eef4ff;font:16px/1.6 system-ui}h1{font-size:28px}label{display:inline-block;margin:0 20px 20px 0}select{display:block;min-height:44px;font:inherit;background:#14253d;color:inherit;border:1px solid #8bbaf0;padding:8px}main{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}figure{margin:0;min-width:0}img{display:block;width:100%;height:auto}a{color:#b0daff}figcaption{margin-bottom:14px}@media(max-width:650px){main{grid-template-columns:1fr}}</style><h1>Nexo Digital Studio · V3.1 / V4</h1><p>Antes y después del mismo recorrido. Capturas locales; no es una publicación del sitio.</p><label>Ruta<select id="route"><option>home</option><option>servicios</option><option>servicios-landing-pages</option><option>servicios-sitios-corporativos</option><option>servicios-sistemas-web</option><option>servicios-aplicaciones-moviles</option><option>servicios-inteligencia-artificial</option><option>servicios-automatizacion</option><option>servicios-auditoria-qa</option><option>servicios-seo</option><option>servicios-integraciones</option><option>soluciones</option><option>portafolio</option><option>nosotros</option><option>blog</option><option>contacto</option><option>no-existe</option></select></label><label>Ancho<select id="width"><option>390</option><option>768</option><option selected>1440</option></select></label><main><figure><figcaption>V3.1 · Antes · <a id="before-link">Abrir imagen</a></figcaption><img id="before" alt="Página anterior completa"></figure><figure><figcaption>V4 · Después · <a id="after-link">Abrir imagen</a></figcaption><img id="after" alt="Página migrada completa"></figure></main><script>const route=document.getElementById("route"),width=document.getElementById("width");function update(){const file=route.value+"-"+width.value+"-full.png";for(const [id,folder] of [["before","before"],["after","phase-6-final"]]){document.getElementById(id).src=folder+"/"+file;document.getElementById(id+"-link").href=folder+"/"+file;}}route.onchange=width.onchange=update;update();</script></html>
